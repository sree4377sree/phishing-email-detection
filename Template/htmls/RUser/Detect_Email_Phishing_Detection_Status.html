{% extends 'RUser/Header.html' %}
{% block userblock %}

<link href="https://fonts.googleapis.com/css?family=Righteous" rel="stylesheet">

<style>

.predict-container{
width:650px;
margin:auto;
margin-top:40px;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

.title{
text-align:center;
font-family:'Righteous', cursive;
font-size:24px;
color:#e74c3c;
margin-bottom:20px;
}

.form-group{
margin-bottom:15px;
}

label{
font-weight:bold;
color:#e74c3c;
display:block;
margin-bottom:5px;
}

input, textarea{
width:100%;
padding:8px;
border:1px solid #ccc;
border-radius:5px;
font-size:14px;
}

textarea{
height:100px;
resize:none;
}

button{
background:#e74c3c;
color:white;
border:none;
padding:10px 20px;
border-radius:5px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#c0392b;
}

.result-box{
margin-top:30px;
padding:15px;
text-align:center;
font-size:20px;
font-weight:bold;
background:#f4f4f4;
border-radius:8px;
}

</style>


<div class="predict-container">

<div class="title">
Predict Email Phishing Detection Status
</div>

<form method="POST">
{% csrf_token %}

<div class="form-group">
<label>Sender</label>
<input type="text" name="sender">
</div>

<div class="form-group">
<label>Receiver</label>
<input type="text" name="receiver">
</div>

<div class="form-group">
<label>Email Date</label>
<input type="text" name="edate">
</div>

<div class="form-group">
<label>Subject</label>
<input type="text" name="subject">
</div>

<div class="form-group">
<label>Email Body</label>
<textarea name="body"></textarea>
</div>

<div style="text-align:center">
<button type="submit">Predict</button>
</div>

</form>

{% if objs %}

<div class="result-box">
Predicted Email Phishing Detection Status : {{objs}}
</div>

{% endif %}

</div>

{% endblock %}
