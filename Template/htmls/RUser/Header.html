<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhishingGNN — Phishing Email Detection</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
  --bg:#f8fafc;
  --bg-2:#eef2ff;
  --surface:#ffffff;
  --surface-2:#f1f5f9;
  --border:#e2e8f0;
  --text:#334155;
  --muted:#64748b;
  --heading:#0f172a;
  --primary:#4f46e5;
  --primary-hover:#6366f1;
  --danger:#ef4444;
  --success:#10b981;
  --shadow:0 10px 30px rgba(15,23,42,.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:linear-gradient(135deg,#f8fafc 0%,#eef2ff 50%,#f8fafc 100%);
  color:var(--text);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--primary);text-decoration:none;}
a:hover{color:var(--primary-hover);}

/* Header */
.site-header{
  background:linear-gradient(135deg,#ffffff,#eef2ff);
  border-bottom:1px solid var(--border);
  box-shadow:0 4px 20px rgba(0,0,0,.35);
  padding:22px 24px;
  text-align:center;
}
.site-header h1{
  margin:0;
  font-size:clamp(16px,2.2vw,22px);
  font-weight:700;
  color:var(--heading);
  letter-spacing:-.01em;
  line-height:1.3;
}
.site-header .subtitle{
  margin:6px 0 0;
  font-size:12px;
  color:var(--muted);
  letter-spacing:.04em;
  text-transform:uppercase;
}

/* Nav */
.topnav{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  padding:14px 16px;
  background:rgba(255,255,255,.8);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:50;
}
.topnav a{
  color:var(--text);
  text-decoration:none;
  padding:9px 16px;
  font-size:13px;
  font-weight:500;
  border-radius:8px;
  border:1px solid transparent;
  transition:all .15s ease;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.topnav a:hover{
  background:var(--surface-2);
  color:var(--heading);
  border-color:var(--border);
  transform:translateY(-1px);
}
.topnav a.logout{
  background:rgba(229,72,77,.15);
  color:#fca5a5;
  border-color:rgba(229,72,77,.3);
}
.topnav a.logout:hover{
  background:var(--danger);
  color:#fff;
}

/* Content */
.mainholder{
  max-width:1200px;
  margin:0 auto;
  padding:32px 20px 60px;
}
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:24px;
  box-shadow:var(--shadow);
}
.card h2,.card h3{color:var(--heading);margin:0 0 14px;}
.btn{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:9px 18px;
  border-radius:8px;
  font-weight:600;
  font-size:13px;
  border:1px solid var(--border);
  background:var(--surface-2);
  color:var(--heading);
  cursor:pointer;
  transition:all .15s ease;
  text-decoration:none;
}
.btn:hover{transform:translateY(-1px);background:var(--primary);color:#fff;border-color:var(--primary);}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary);}
.btn-primary:hover{background:var(--primary-hover);}
.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger);}
input,textarea,select{
  width:100%;
  padding:10px 12px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--surface-2);
  color:var(--heading);
  font-family:inherit;
  font-size:14px;
  transition:border-color .15s;
}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary);}
table{width:100%;border-collapse:collapse;}
th,td{padding:12px 14px;border-bottom:1px solid var(--border);text-align:left;}
th{background:var(--surface-2);color:var(--heading);font-weight:600;font-size:13px;}
tr:hover td{background:rgba(56,169,232,.05);}
img{max-width:100%;border-radius:10px;}

@media(max-width:640px){
  .site-header h1{font-size:15px;}
  .topnav a{font-size:12px;padding:7px 10px;}
  .mainholder{padding:20px 12px 40px;}
}
</style>
</head>
<body>

<header class="site-header">
  <h1>PhishingGNN</h1>
  <p class="subtitle">Phishing Email Detection Using DistilBERT Feature Extraction &amp; Graph Attention Networks</p>
</header>

<nav class="topnav">
  <a href="{% url 'Detect_Email_Phishing_Detection_Status' %}"><i class="fa-solid fa-shield-halved"></i> Predict Status</a>
  <a href="{% url 'ViewYourProfile' %}"><i class="fa-solid fa-user"></i> Profile</a>

  <a class="logout" href="{% url 'login' %}"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
</nav>

<main class="mainholder">
  {% block userblock %}{% endblock %}
</main>

</body>
</html>
