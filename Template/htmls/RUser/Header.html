<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>

<link href="https://fonts.googleapis.com/css?family=Russo+One" rel="stylesheet">

<style>

body{
background:url("{% static 'bg.jpg' %}") center/cover no-repeat fixed;
font-family:'Russo One',sans-serif;
margin:0;
}

/* HEADER */

.header{
text-align:center;
padding:30px;
background:blue;
}

.header h1{
color:#ffffff;
font-size:28px;
margin:0;
}

/* NAVBAR */

.topnav{
display:flex;
justify-content:center;

}

.topnav a{
color:white;
text-decoration:none;
padding:14px 18px;
font-size:15px;

border-radius:5px;
transition:0.3s;
}

.topnav a:hover{

}

.logout{

}

/* MAIN CONTENT */

.mainholder{
padding:30px;
}

<body>

<div class="header">
<h1>
PhishingGNN:Phishing Email Detection Using DistilBERT Feature Extraction And Graph Attention Networks
</h1>
</div>

<div class="topnav">

<a href="{% url 'Detect_Email_Phishing_Detection_Status' %}">
Predict Email Phishing Detection Status
</a>

<a href="{% url 'ViewYourProfile' %}">
View Your Profile
</a>

<a class="logout" href="{% url 'login' %}">
Logout
</a>

</div>

<div class="mainholder">
{% block userblock %}
{% endblock %}
</div>

</html>
