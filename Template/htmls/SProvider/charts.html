{% extends 'SProvider/Header.html' %}
{% block researchblock %}

<style>

.container{
display:flex;
margin-top:30px;
}

/* SIDEBAR */

.sidebar{
width:200px;
background:#2c3e50;
padding:20px;
border-radius:6px;
}

.sidebar a{
display:block;
color:white;
padding:10px;
margin:10px 0;
text-decoration:none;
border-radius:4px;
}

.sidebar a:hover{
background:#3498db;
}

/* CHART AREA */

.chart-area{
flex:1;
padding:20px;
background:white;
margin-left:20px;
border-radius:6px;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

#chartContainer{
width:100%;
height:420px;
}

</style>


<script>
window.onload = function () {

var chart = new CanvasJS.Chart("chartContainer", {
animationEnabled: true,
title:{
text:"Email Phishing Detection Status Ratio"
},

data:[{

{% if chart_type == "line" %}
type:"line",
{% elif chart_type == "pie" %}
type:"pie",
{% elif chart_type == "spline" %}
type:"spline",
{% endif %}

yValueFormatString:"##0.00\"%\"",
indexLabel:"{label} {y}",

dataPoints:[

{% for o in form %}
{ y: {{o.dcount}}, label:"{{o.names}}" },
{% endfor %}

]

}]

});

chart.render();

}
</script>


<div class="container">

<div class="sidebar">

<h3 style="color:white">Charts</h3>

<a href="{% url 'charts' 'pie' %}">Pie Chart</a>

<a href="{% url 'charts' 'line' %}">Line Chart</a>

</div>

<div class="chart-area">

<div id="chartContainer"></div>

</div>

</div>

<script src="https://canvasjs.com/assets/script/canvasjs.min.js"></script>

{% endblock %}
