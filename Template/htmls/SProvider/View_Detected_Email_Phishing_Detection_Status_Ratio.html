{% extends 'SProvider/Header.html' %}
{% block researchblock %}

<link href="https://fonts.googleapis.com/css?family=Righteous" rel="stylesheet">

<style>

.page-container{
width:90%;
margin:auto;
margin-top:40px;
background:white;
padding:40px;
border-radius:10px;
box-shadow:0px 5px 15px rgba(0,0,0,0.3);
}

.title{
text-align:center;
font-family:'Righteous', cursive;
color:#e74c3c;
font-size:26px;
margin-bottom:20px;
}

.table-box{
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
text-align:center;
}

table th{
background:#e74c3c;
color:white;
padding:12px;
font-size:16px;
}

table td{
padding:12px;
font-size:18px;
}

table tr:nth-child(even){
background:#f4f4f4;
}

table tr:hover{
background:#ffe6e6;
}

.ratio{
color:#f1c40f;
background:#e74c3c;
font-weight:bold;
border-radius:5px;
}

</style>


<div class="page-container">

<div class="title">
View Email Detection Type Found Ratio Details
</div>

<div class="table-box">

<table>

<tr>
<th>Email Detection Type</th>
<th>Ratio</th>
</tr>

{% for object in objs %}

<tr>

<td style="color:#e74c3c;font-weight:bold;">
{{object.names}}
</td>

<td class="ratio">
{{object.ratio}}
</td>

</tr>

{% endfor %}

</table>

</div>

</div>

{% endblock %}
